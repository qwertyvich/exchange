server {
    listen 80;
    listen [::]:80;
    server_name exchange.kraken892.rest;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "Casper Exchange is starting. Please try again shortly.\n";
    }
}

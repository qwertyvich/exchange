# Isolated server stack. The existing host nginx terminates TLS and proxies to 5183.
name: casper-exchange
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange -d exchange"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    logging: *logging
    restart: unless-stopped
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://exchange:${POSTGRES_PASSWORD}@postgres:5432/exchange
    volumes:
      - receipt_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s
    mem_limit: 768m
    logging: *logging
    restart: unless-stopped
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5183}:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging
    restart: unless-stopped
volumes:
  postgres_data:
  receipt_data:
